exp:
  workdir_root: ./results

system:
  device: cuda:0
  seed: 42

method:
  name: ours
  target: x0_precond

sample:
  nfe: 300

time:
  train_T: 1.0
  sample_T: 0.996
  terminal_time: 0.0

measurement:
  type: center_mask
  noise_std: 0.1
  hole_ratio: 0.5
  same_normalization: false
  normalization_form: scale_only
  stats_mode: standard
  stats_update_mode: fixed

dynamics:
  type: kolmogorov
  num_samples: 10
  dim: 128
  dt: 0.2
  reynolds: 1000

steps:
  initial: 50
  end: 100
  gap: 10

model:
  type: UNet
  in_channels: 2
  out_channels: 2
  model_channels: 32
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  channel_mult: [1, 2, 4, 8]
  dropout: 0.0
  conv_resample: true
  dims: 2
  num_heads: 1
  num_head_channels: -1
  num_heads_upsample: -1
  use_scale_shift_norm: true
  resblock_updown: true
  use_new_attention_order: false

pretrain:
  ckpt: checkpoints/kolmogorov_128/center_mask.pt
  num_samples: 1000
  val_ratio: 0.1
  batch_size: 16
  epoch: 400
  lr: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.99]

train:
  pretrained: true
  epoch: 200
  batch_size: 16
  lr: 5.0e-05
  weight_decay: 0.01
  betas: [0.9, 0.99]
  val_ratio: 0.1
  online:
    full_epoch: 150
    finetune_first: true
